# infrastructure/k8s/base/ingress-controller.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invify-production-ingress
  namespace: invify-production
  annotations:
    # NGINX Ingress Controller enforcement parameters
    kubernetes.io/ingress.class: "nginx"
    
    # Automated TLS provision integration via cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    
    # Performance & buffering tuning preventing large payload dropouts
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "16"
    
    # WebSocket support & connection hold parameters
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    
    # Custom headers passing dynamic attributes upstream
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      
    # Adaptive Edge DDoS & burst protection rate limits
    nginx.ingress.kubernetes.io/limit-rps: "150"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # Enforce strict secure transport encryption rules
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
spec:
  tls:
    - hosts:
        - api.invify.app
        - ops.invify.app
        - stream.invify.app
      secretName: invify-production-tls-cert
  rules:
    # 1. Primary API Gateway routing
    - host: api.invify.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: invify-backend-service
                port:
                  number: 3005
                  
    # 2. Operator Governance & Fleet Monitoring UI Hub
    - host: ops.invify.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: invify-admin-console-service
                port:
                  number: 80
                  
    # 3. High-Throughput Realtime WebSocket Edge Subsystem
    - host: stream.invify.app
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: invify-websocket-gateway-service
                port:
                  number: 4000
