# infrastructure/k8s/base/secret-management.yaml
# Fulfills requirement: Externalized secret governance mapping Vault backend targets directly into transient local K8s secrets.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: invify-production-vault-store
  namespace: invify-production
spec:
  provider:
    # Integrates HashiCorp Vault key-value engine configurations natively
    vault:
      server: "https://vault.invify.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "invify-production-role"
          serviceAccountRef:
            name: "default"
---
# ExternalSecret pulling relational database paths and application master tokens
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sync-invify-backend-secrets
  namespace: invify-production
spec:
  refreshInterval: "1h" # Continuously evaluate Vault backends ensuring active cryptographic rotation synchronizations
  secretStoreRef:
    name: invify-production-vault-store
    kind: SecretStore
  target:
    name: invify-backend-secrets # Local K8s secret generated automatically for pods
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          environment: production
          managed-by: external-secrets-operator
  data:
    - secretKey: MATRIX_DB_URL
      remoteRef:
        key: production/database
        property: connection_string
    - secretKey: REDIS_CLUSTER_URL
      remoteRef:
        key: production/redis
        property: cluster_url
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: production/redis
        property: auth_pass
    - secretKey: JWT_MASTER_KEY
      remoteRef:
        key: production/security
        property: jwt_rsa_private_key
    - secretKey: QUEUE_BROKER_URL
      remoteRef:
        key: production/rabbitmq
        property: amqp_connection_uri
---
# Replicate secret definitions strictly isolated for target Data Core compute pods
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: invify-datacore-vault-store
  namespace: invify-data-core
spec:
  provider:
    vault:
      server: "https://vault.invify.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "invify-datacore-role"
          serviceAccountRef:
            name: "default"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sync-minio-storage-credentials
  namespace: invify-data-core
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: invify-datacore-vault-store
    kind: SecretStore
  target:
    name: minio-storage-credentials
    creationPolicy: Owner
  data:
    - secretKey: ROOT_USER
      remoteRef:
        key: production/minio
        property: root_user
    - secretKey: ROOT_PASSWORD
      remoteRef:
        key: production/minio
        property: root_password
    - secretKey: ACCESS_KEY
      remoteRef:
        key: production/minio
        property: s3_access_key
    - secretKey: SECRET_KEY
      remoteRef:
        key: production/minio
        property: s3_secret_key
