# infrastructure/k8s/observability/infrastructure-observability.yaml
# Fulfills requirement: Deep physical and virtual server node resource monitoring across bare-metal environments.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: invify-observability
  labels:
    app.kubernetes.io/name: node-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      hostNetwork: true # Required to monitor parent physical machine hardware interfaces directly
      hostPID: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.7.0
          args:
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
          ports:
            - containerPort: 9100
              hostPort: 9100
              name: metrics
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-service
  namespace: invify-observability
  labels:
    app.kubernetes.io/name: node-exporter
spec:
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
  selector:
    app.kubernetes.io/name: node-exporter
---
# Declarative hardware SLA thresholds and kernel saturation warning rules
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-kernel-saturation-rules
  namespace: invify-observability
  labels:
    role: alert-rules
spec:
  groups:
    - name: node-kernel-saturation.rules
      rules:
        # 1. Alert on persistent disk IO latency spikes exceeding threshold parameters
        - alert: HostDiskIOLatencyDegraded
          expr: rate(node_disk_io_time_seconds_total[1m]) > 0.8
          for: 2m
          labels:
            severity: critical
            tier: physical-node
          annotations:
            summary: "Critical Host Storage IO wait time threshold exceeded."
            description: "Physical disk IO loops on bare-metal node {{ $labels.instance }} are highly saturated. May affect synchronous WAL flushes."
            
        # 2. Alert on CPU core starvation / CPU SoftIRQ thread locking
        - alert: HostCPUSoftirqSaturation
          expr: sum by (instance) (rate(node_cpu_seconds_total{mode="softirq"}[1m])) / sum by (instance) (rate(node_cpu_seconds_total[1m])) > 0.25
          for: 1m
          labels:
            severity: warning
            tier: physical-node
          annotations:
            summary: "High network interface SoftIRQ thread saturation intercepted."
            description: "Server host kernel is expending >25% processing cycles solely managing packet interrupts. Evaluate kernel packet ring parameters."
