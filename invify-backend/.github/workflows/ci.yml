name: CI — Build, Test, Staging Path

# Phase 3 promotion foundation:
# FEATURE → main → build → test → security → (optional) staging deploy
# Production remains approval-gated via production.yml on release tags.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit / integration / security tests
        run: npm test
        env:
          NODE_ENV: test
          BUILD_VARIANT: LOCAL
          JWT_SECRET: ci-test-jwt-secret-key-32chars!!
          SUPABASE_JWT_SECRET: ci-test-supabase-jwt-secret-32!
          LICENSE_HMAC_SECRET: ci-test-license-hmac-secret-32!
      - name: Phase 2 security regression
        run: npm test -- --testPathPattern="phase2.security|commission.security"
        env:
          NODE_ENV: test
          BUILD_VARIANT: LOCAL
          JWT_SECRET: ci-test-jwt-secret-key-32chars!!
          SUPABASE_JWT_SECRET: ci-test-supabase-jwt-secret-32!
          LICENSE_HMAC_SECRET: ci-test-license-hmac-secret-32!

  container:
    name: Build Container Artifact
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t invify-backend:ci --target runner .
      - name: Smoke start + health contract
        run: |
          docker run -d --name invify-ci \
            -e NODE_ENV=development \
            -e BUILD_VARIANT=LOCAL \
            -e JWT_SECRET=ci-test-jwt-secret-key-32chars!! \
            -e SUPABASE_JWT_SECRET=ci-test-supabase-jwt-secret-32! \
            -e LICENSE_HMAC_SECRET=ci-test-license-hmac-secret-32! \
            -e PORT=3000 \
            -p 3000:3000 \
            invify-backend:ci
          sleep 8
          curl --fail http://127.0.0.1:3000/livez
          curl --fail http://127.0.0.1:3000/health
          docker logs invify-ci | tail -n 40
          docker stop invify-ci
          docker rm invify-ci

  staging-deploy:
    name: Staging Deploy (manual / main)
    needs: container
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push staging image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          target: runner
      - name: Staging smoke (optional endpoint)
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          if [ -z "$STAGING_API_URL" ]; then
            echo "STAGING_API_URL not configured — image pushed; external apply deferred"
            exit 0
          fi
          curl --fail "$STAGING_API_URL/livez"
          curl --fail "$STAGING_API_URL/readyz"
