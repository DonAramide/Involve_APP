name: Production Release (Approval Gated)

# Production path: release tag only → validate → scan → approval environment → push image → optional smoke.
# Does NOT automatically apply cluster manifests or enable live payments.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Code Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
          BUILD_VARIANT: LOCAL
          JWT_SECRET: ci-test-jwt-secret-key-32chars!!
          SUPABASE_JWT_SECRET: ci-test-supabase-jwt-secret-32!
          LICENSE_HMAC_SECRET: ci-test-license-hmac-secret-32!
      - run: npm test -- --testPathPattern="phase2.security|commission.security"
        env:
          NODE_ENV: test
          BUILD_VARIANT: LOCAL
          JWT_SECRET: ci-test-jwt-secret-key-32chars!!
          SUPABASE_JWT_SECRET: ci-test-supabase-jwt-secret-32!
          LICENSE_HMAC_SECRET: ci-test-license-hmac-secret-32!

  security-scan:
    name: Container Security & SBOM
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t temp-image:latest --target runner .
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'temp-image:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: temp-image:latest
          format: cyclonedx-json
          output-file: sbom.json
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  deploy:
    name: Production Image Publish (Approval Required)
    needs: security-scan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runner
      - name: Optional production smoke (disabled unless PROD_API_URL set)
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
        run: |
          if [ -z "$PROD_API_URL" ]; then
            echo "PROD_API_URL not set — image published; live traffic NOT activated (Phase 3)"
            exit 0
          fi
          echo "Waiting briefly..."
          sleep 15
          curl --fail "$PROD_API_URL/livez"
          curl --fail "$PROD_API_URL/readyz"
          curl --fail "$PROD_API_URL/health"
          echo "Smoke against configured PROD_API_URL completed."
