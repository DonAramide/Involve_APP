apiVersion: apps/v1
kind: Deployment
metadata:
  name: invify-backend
  labels:
    app: invify-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: invify-backend
  template:
    metadata:
      labels:
        app: invify-backend
    spec:
      containers:
      - name: invify-backend
        image: ghcr.io/invify/invify-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: invify-config
        - secretRef:
            name: invify-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /livez
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
