apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invify-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.invify.app
    secretName: invify-tls
  rules:
  - host: api.invify.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: invify-service
            port:
              number: 80
