version: '3.8'

# Production deployment FOUNDATION — not activated for live traffic in Phase 3.
# Secrets must be injected from a secret manager (never committed).
# FEATURE_REAL_MONEY_PAYOUTS remains false until an explicit later phase.

services:
  api:
    image: ${PRODUCTION_IMAGE:?PRODUCTION_IMAGE is required}
    ports:
      - "${PRODUCTION_API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - BUILD_VARIANT=PROD
      - PORT=3000
      - SUPABASE_URL=${PROD_SUPABASE_URL:?PROD_SUPABASE_URL is required}
      - PROD_SUPABASE_URL=${PROD_SUPABASE_URL}
      - PROD_SUPABASE_PUBLISHABLE_KEY=${PROD_SUPABASE_PUBLISHABLE_KEY:?PROD_SUPABASE_PUBLISHABLE_KEY is required}
      - PROD_SUPABASE_SECRET_KEY=${PROD_SUPABASE_SECRET_KEY:?PROD_SUPABASE_SECRET_KEY is required}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - LICENSE_HMAC_SECRET=${LICENSE_HMAC_SECRET:?LICENSE_HMAC_SECRET is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - APP_URL=${PROD_APP_URL:?PROD_APP_URL is required}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://app.invify.org}
      - PROD_AGENT_PORTAL_URL=${PROD_AGENT_PORTAL_URL:?PROD_AGENT_PORTAL_URL is required}
      - QUASAR_BASE_URL=${PROD_QUASAR_BASE_URL:?PROD_QUASAR_BASE_URL is required}
      - QUASAR_WEBHOOK_SIGNING_SECRET=${QUASAR_WEBHOOK_SIGNING_SECRET:?QUASAR_WEBHOOK_SIGNING_SECRET is required}
      - ENABLE_SIMULATOR=false
      - FEATURE_REAL_MONEY_PAYOUTS=${FEATURE_REAL_MONEY_PAYOUTS:-false}
      - OFFLINE_LOCAL_AUTH=false
      - OFFLINE_MOCK_AUTH=false
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  prod_redis_data:
