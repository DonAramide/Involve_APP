org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512M -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -XX:SoftRefLRUPolicyMSPerMB=50
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
org.gradle.daemon=false

android.useAndroidX=true

# Flutter 3.38 still uses the legacy AGP DSL. Opt out so plugins
# (audioplayers_android, flutter-gradle-plugin) do not NPE / fail configure.
android.newDsl=false
