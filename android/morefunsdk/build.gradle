plugins {
    id 'com.android.library'
}

android {
    namespace 'com.invify.morefunsdk'
    compileSdk 34

    defaultConfig {
        minSdk 21
        consumerProguardFiles "consumer-rules.pro"
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            java {
                exclude '**/mposdirect/MposHomeActivity.java'
                exclude '**/mposdirect/MposKeyExchangeActivity.java'
                exclude '**/mposdirect/MposPaymentActivity.java'
                exclude '**/mposdirect/MposKeepAliveService.java'
                exclude '**/mposdirect/MposConnectionKeepAlive.java'
                exclude '**/sample/activity/BluetoothConnectActivity.java'
                exclude '**/sample/adapter/**'
                exclude '**/sample/utils/SweetDialogUtils.java'
            }
            res {
                exclude '**/layout/activity_mpos_direct_*.xml'
                exclude '**/layout/activity_connect_bluetooth.xml'
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'org.jpos:jpos:2.1.10'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    compileOnly 'org.osgi:org.osgi.core:6.0.0'
    compileOnly 'org.bouncycastle:bcprov-jdk15on:1.55'
    compileOnly 'commons-cli:commons-cli:1.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
