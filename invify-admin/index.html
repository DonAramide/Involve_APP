<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/vite.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900|Material+Icons" rel="stylesheet" type="text/css" media="print" onload="this.media='all'">
    <title>Invify - Enterprise Business & Financial Operations Platform</title>
    <meta name="description" content="Invify brings invoicing, payments, financial operations, inventory, reconciliation and business intelligence into one connected platform.">
    <style>
      html, body, #app { margin: 0; min-height: 100%; background: #05070d; }
      .invify-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        color: rgba(255,255,255,0.72);
        font-family: Roboto, system-ui, sans-serif;
      }
      .invify-boot__mark {
        width: 90px;
        height: 90px;
        position: relative;
        display: grid;
        place-items: center;
        animation: invify-pulse 1.2s ease-in-out infinite alternate;
        filter: drop-shadow(0 0 18px rgba(99, 102, 241, 0.35));
      }
      .invify-boot__ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(99, 102, 241, 0.15);
        border-top-color: #6366f1;
        animation: invify-spin 1s linear infinite;
      }
      .invify-boot__badge {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .invify-boot__logo { width: 49px; height: 49px; object-fit: contain; }
      .invify-boot__message { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      @keyframes invify-pulse { from { transform: scale(0.85); } to { transform: scale(1.05); } }
      @keyframes invify-spin { to { transform: rotate(360deg); } }
    </style>
    
    <!-- Open Graph -->
    <meta property="og:title" content="Invify - Enterprise Platform">
    <meta property="og:description" content="Manage your money, inventory, and operations in one place.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://invify.org">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Invify">
    <meta name="twitter:description" content="The enterprise business and financial operations platform.">
  </head>
  <body>
    <div id="app">
      <div class="invify-boot" role="status" aria-live="polite">
        <div class="invify-boot__mark">
          <div class="invify-boot__ring"></div>
          <div class="invify-boot__badge">
            <img src="/brand/invify-logo.png" alt="Invify" class="invify-boot__logo" />
          </div>
        </div>
        <div class="invify-boot__message">LOADING INVIFY...</div>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById('app')
        if (!root) return
        var boot = root.querySelector('.invify-boot')
        if (!boot || root.childElementCount !== 1) return
        var msg = boot.querySelector('.invify-boot__message')
        if (msg) {
          msg.textContent = 'Still loading. Check your connection, then refresh.'
        }
        if (boot.querySelector('button')) return
        var btn = document.createElement('button')
        btn.type = 'button'
        btn.textContent = 'Refresh'
        btn.style.cssText = 'margin-top:4px;padding:10px 18px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-weight:700;cursor:pointer;'
        btn.onclick = function () { window.location.reload() }
        boot.appendChild(btn)
      }, 12000)
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
